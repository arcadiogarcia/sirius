name: Release & Publish NuGet

# Cut a release by pushing a tag of the form vMAJOR.MINOR.PATCH[-suffix],
# e.g. v0.1.0 or v0.2.0-rc.1. The tag is the single source of truth for
# the published package version.
#
# workflow_dispatch lets us re-run the pipeline against an existing tag
# without having to delete-and-re-push it (handy for iterating on the
# release plumbing itself).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, pack, and publish
    runs-on: windows-latest
    steps:
      - name: Resolve ref
        id: ref
        shell: pwsh
        run: |
          # On push events github.ref_name is the tag. On manual dispatch
          # we accept the tag from inputs so we can re-run against an
          # already-pushed tag.
          $ref = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if (-not $ref) { throw "No tag provided." }
          Write-Host "Building from ref: $ref"
          "REF=$ref" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.REF }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "==== dotnet --info ===="
          dotnet --info
          Write-Host "==== installed workloads ===="
          dotnet workload list

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ steps.ref.outputs.REF }}"
          $ver = $tag -replace "^v", ""
          if ($ver -match "^(\d+\.\d+\.\d+)(?:-(.+))?$") {
              $prefix = $Matches[1]
              $suffix = if ($Matches.Count -gt 2) { $Matches[2] } else { "" }
          } else {
              throw "Tag '$tag' is not in vMAJOR.MINOR.PATCH[-suffix] form."
          }
          Write-Host "PackageVersion=$ver  Prefix=$prefix  Suffix=$suffix"
          "VERSION=$ver"   >> $env:GITHUB_OUTPUT
          "PREFIX=$prefix" >> $env:GITHUB_OUTPUT
          "SUFFIX=$suffix" >> $env:GITHUB_OUTPUT

      - name: Stamp build date
        id: stamp
        shell: pwsh
        run: |
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "BUILD_DATE=$now" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Sirius.Updater.sln

      - name: Build core (Sirius.Updater)
        run: |
          dotnet build src/Sirius.Updater/Sirius.Updater.csproj `
            -c Release --no-restore `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -p:SiriusBuildDate=${{ steps.stamp.outputs.BUILD_DATE }}

      - name: Build WinUI integration (x64)
        run: |
          dotnet build src/Sirius.Updater.WinUI/Sirius.Updater.WinUI.csproj `
            -c Release --no-restore -p:Platform=x64 `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -p:SiriusBuildDate=${{ steps.stamp.outputs.BUILD_DATE }}

      - name: Build tests
        # MUST forward VersionPrefix here too: the test project has a
        # ProjectReference to src/Sirius.Updater, so MSBuild rebuilds
        # Sirius.Updater.dll into the SAME bin\Release output that the
        # subsequent `dotnet pack --no-build` will pack. If we omit
        # VersionPrefix the rebuild silently falls back to the
        # Directory.Build.props default (0.1.0), overwrites the
        # correctly-stamped DLL produced by "Build core", and ships a
        # nupkg whose AssemblyVersion doesn't match its PackageVersion.
        # Consumers then fail at runtime with FileNotFoundException
        # when SiriusUpdater.WinUI tries to load the (non-existent)
        # matching Sirius.Updater assembly version.
        run: |
          dotnet build tests/Sirius.Updater.Tests/Sirius.Updater.Tests.csproj `
            -c Release --no-restore `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -p:SiriusBuildDate=${{ steps.stamp.outputs.BUILD_DATE }}

      - name: Test
        run: dotnet test tests/Sirius.Updater.Tests/Sirius.Updater.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Pack
        run: |
          dotnet pack src/Sirius.Updater/Sirius.Updater.csproj `
            -c Release --no-build `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -o artifacts
          dotnet pack src/Sirius.Updater.WinUI/Sirius.Updater.WinUI.csproj `
            -c Release --no-build -p:Platform=x64 `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -o artifacts

      - name: List packages
        shell: pwsh
        run: Get-ChildItem artifacts | Format-Table Name, Length

      - name: Verify nupkg assembly versions match tag
        # Defense in depth: if a future workflow edit ever re-introduces
        # the "transitive ProjectReference rebuild overwrites the stamped
        # DLL" bug, fail the release here instead of shipping a broken
        # package. We crack each .nupkg open as a zip and confirm every
        # bundled Sirius assembly has AssemblyVersion == ${PREFIX}.0
        # (the canonical 4-part form .NET emits from VersionPrefix).
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = "${{ steps.version.outputs.PREFIX }}.0"
          $bad = @()
          foreach ($nupkg in Get-ChildItem artifacts\*.nupkg) {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
              try {
                  foreach ($entry in $zip.Entries) {
                      if ($entry.FullName -notlike 'lib/*Sirius.Updater*.dll') { continue }
                      $tmp = [System.IO.Path]::Combine([System.IO.Path]::GetTempPath(), [System.IO.Path]::GetRandomFileName() + '.dll')
                      [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp, $true)
                      try {
                          $asm = [System.Reflection.AssemblyName]::GetAssemblyName($tmp)
                          Write-Host "  $($nupkg.Name) :: $($entry.FullName) -> $($asm.Version)"
                          if ($asm.Version.ToString() -ne $expected) {
                              $bad += "$($nupkg.Name) :: $($entry.FullName) has AssemblyVersion=$($asm.Version), expected $expected"
                          }
                      } finally { Remove-Item $tmp -ErrorAction SilentlyContinue }
                  }
              } finally { $zip.Dispose() }
          }
          if ($bad.Count -gt 0) {
              Write-Host "::error::Assembly-version mismatch detected in built nupkgs:"
              $bad | ForEach-Object { Write-Host "::error::  $_" }
              throw "Refusing to publish a release whose assembly version doesn't match the git tag."
          }
          Write-Host "All bundled Sirius.Updater assemblies report AssemblyVersion=$expected. OK."

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.REF }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
              throw "NUGET_API_KEY repository secret is not set."
          }
          # NOTE: --skip-duplicate intentionally NOT used. Silent skip on
          # a duplicate version masks "already pushed broken artifact"
          # scenarios. Bump the tag if you need to re-publish.
          Get-ChildItem artifacts\*.nupkg | ForEach-Object {
              Write-Host "Pushing $($_.Name)..."
              dotnet nuget push $_.FullName `
                  --api-key $env:NUGET_API_KEY `
                  --source https://api.nuget.org/v3/index.json
              if ($LASTEXITCODE -ne 0) { throw "Push failed for $($_.Name)" }
          }