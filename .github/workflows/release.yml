name: Release & Publish NuGet

# Cut a release by pushing a tag of the form vMAJOR.MINOR.PATCH[-suffix],
# e.g. v0.1.0 or v0.2.0-rc.1. The tag is the single source of truth for
# the published package version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # for softprops/action-gh-release to create the release

jobs:
  release:
    name: Build, pack, and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # action-gh-release likes a full history for autogen notes.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"     # e.g. "v0.1.0" or "v0.2.0-rc.1"
          $ver = $tag -replace '^v', ''       # → "0.1.0" / "0.2.0-rc.1"
          if ($ver -match '^(\d+\.\d+\.\d+)(?:-(.+))?$') {
              $prefix = $Matches[1]
              $suffix = if ($Matches.Count -gt 2) { $Matches[2] } else { '' }
          } else {
              throw "Tag '$tag' is not in vMAJOR.MINOR.PATCH[-suffix] form."
          }
          Write-Host "PackageVersion=$ver  Prefix=$prefix  Suffix=$suffix"
          "VERSION=$ver"   >> $env:GITHUB_OUTPUT
          "PREFIX=$prefix" >> $env:GITHUB_OUTPUT
          "SUFFIX=$suffix" >> $env:GITHUB_OUTPUT

      - name: Stamp build date
        id: stamp
        shell: pwsh
        run: |
          # ISO-8601 / round-trip so the embedded value parses back via
          # DateTimeOffset.ParseExact in any locale.
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "BUILD_DATE=$now" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Sirius.Updater.sln

      - name: Build core (Sirius.Updater)
        run: |
          dotnet build src/Sirius.Updater/Sirius.Updater.csproj `
            -c Release --no-restore `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -p:SiriusBuildDate=${{ steps.stamp.outputs.BUILD_DATE }}

      - name: Build WinUI integration (x64)
        run: |
          dotnet build src/Sirius.Updater.WinUI/Sirius.Updater.WinUI.csproj `
            -c Release --no-restore -p:Platform=x64 `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -p:SiriusBuildDate=${{ steps.stamp.outputs.BUILD_DATE }}

      - name: Build WinUI integration (ARM64)
        run: |
          dotnet build src/Sirius.Updater.WinUI/Sirius.Updater.WinUI.csproj `
            -c Release --no-restore -p:Platform=ARM64 `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -p:SiriusBuildDate=${{ steps.stamp.outputs.BUILD_DATE }}

      - name: Test
        run: dotnet test tests/Sirius.Updater.Tests/Sirius.Updater.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Sirius.Updater/Sirius.Updater.csproj `
            -c Release --no-build `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -o artifacts
          dotnet pack src/Sirius.Updater.WinUI/Sirius.Updater.WinUI.csproj `
            -c Release --no-build -p:Platform=x64 `
            -p:VersionPrefix=${{ steps.version.outputs.PREFIX }} `
            -p:VersionSuffix=${{ steps.version.outputs.SUFFIX }} `
            -o artifacts

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
              throw "NUGET_API_KEY repository secret is not set."
          }
          # NOTE: --skip-duplicate intentionally NOT used. Silent skip on
          # a duplicate version masks 'already pushed broken artifact'
          # scenarios. Bump the tag if you need to re-publish.
          Get-ChildItem artifacts\*.nupkg | ForEach-Object {
              Write-Host "Pushing $($_.Name)..."
              dotnet nuget push $_.FullName `
                  --api-key $env:NUGET_API_KEY `
                  --source https://api.nuget.org/v3/index.json
              if ($LASTEXITCODE -ne 0) { throw "Push failed for $($_.Name)" }
          }
